openapi: 3.0.3
info:
  title: WATM Customer API
  description: RESTful API for managing WATM devices, monitoring status, and tracking usage.
  version: 1.0.0
  contact:
    name: WATM API Support
    url: https://watm.review.orases.dev/admin/administrative/support-tickets/edit
  
  license:
    name: Proprietary

servers:
  - url: https://5kpw4wx4a0.execute-api.us-east-1.amazonaws.com/review/api/v1
    description: WATM API Gateway


security:
  - ApiKeyAuth: []

tags:
  - name: Devices
    description: Device management and monitoring operations

paths:
  /devices:
    get:
      tags:
        - Devices
      summary: List devices
      description: |
        Retrieve a paginated list of all devices for the authenticated company.

        Supports filtering by status and searching across multiple fields.
      operationId: listDevices
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 10
        - name: status
          in: query
          description: Filter devices by status
          required: false
          schema:
            type: string
            enum:
              - online
              - offline
              - maintenance
            example: online
        - name: search
          in: query
          description: Search by hostname, serial number, location name, or IMEI
          required: false
          schema:
            type: string
            example: Store
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              examples:
                success:
                  value:
                    devices:
                      - serial_number: "SYS001234"
                        company: "ABC Company"
                        status: "Active / Online"
                        last_checkin: "2025-10-24T14:30:00+00:00"
                        tid: "12345678"
                        location_name: "Store #101"
                        category: "ATM"
                        ip_address: "192.168.1.100"
                        device_manufacturer: "Systech"
                        device_model: "WR11"
                        is_dual_carrier: false
                        signal_strength_percent: 87
                        active_carrier: "VZW"
                        sinr: 13.2
                        sinr_percentage: 66
                        uptime: "30d 5h"
                        service_plan: "Standard Plan"
                        payment_method: "Credit Card"
                    pagination:
                      total: 42
                      page: 1
                      per_page: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /devices/{serialNumber}:
    get:
      tags:
        - Devices
      summary: Get device details
      description: Retrieve comprehensive information about a specific device, including device details, location, and service plan.
      operationId: getDevice
      parameters:
        - name: serialNumber
          in: path
          description: Device serial number
          required: true
          schema:
            type: string
            example: SYS001234
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetails'
              examples:
                success:
                  value:
                    device:
                      status: "Active / Online"
                      device_manufacturer: "Systech"
                      device_model: "WR11"
                      configuration: "Default Config"
                      last_checkin: "2025-10-24T14:30:00+00:00"
                      last_uptime: "30 days, 5 hours"
                      serial_number: "SYS001234"
                      imei: "123456789012345"
                      ip_address: "192.168.1.100"
                    location:
                      location_name: "Store #101"
                      address:
                        address_1: "123 Main St"
                        city: "New York"
                        state: "NY"
                        zip_code: "10001"
                      tid: "12345678"
                      category: "ATM"
                    plan:
                      company: "ABC Company"
                      service_plan: "Standard Plan"
                      flat_rate: 50.00
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{serialNumber}/status:
    get:
      tags:
        - Devices
      summary: Get device status
      description: Retrieve current operational status and connectivity information for a device.
      operationId: getDeviceStatus
      parameters:
        - name: serialNumber
          in: path
          description: Device serial number
          required: true
          schema:
            type: string
            example: SYS001234
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
              examples:
                success:
                  value:
                    serial_number: "SYS001234"
                    status: "active"
                    last_checkin: "2025-10-24T13:30:00+00:00"
                    uptime_hours: 363
                    signal_strength: -75
                    ip_address: "192.168.1.100"
                    carrier: "verizon"
                    connectivity:
                      primary_carrier: "verizon"
                      backup_carrier: null
                      connection_quality: "good"
                    alerts: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{serialNumber}/usage:
    get:
      tags:
        - Devices
      summary: Get device usage
      description: |
        Retrieve data usage information for the current billing cycle.

        **Required Permissions**: `devices.read` AND `device_usages.read`
      operationId: getDeviceUsage
      parameters:
        - name: serialNumber
          in: path
          description: Device serial number
          required: true
          schema:
            type: string
            example: SYS001234
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUsage'
              examples:
                success:
                  value:
                    serial_number: "SYS001234"
                    billing_cycle:
                      start_date: "2025-10-01T00:00:00+00:00"
                      end_date: "2025-10-31T23:59:59+00:00"
                      short_display: "Oct 2025"
                    data_usage:
                      current_bytes: 52428800
                      current_readable: "50.00 MB"
                      projected_bytes: 104857600
                      projected_readable: "100.00 MB"
                    pricing:
                      plan_price: 50.00
                      dual_sim_price: 0.00
                      projected_total_price: 50.00
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authentication. Obtain from the WATM admin interface.

        Format: `apw_{random_string}` (production) or `watm_dev_{random_string}` (development)

  schemas:
    DeviceListItem:
      type: object
      properties:
        serial_number:
          type: string
          description: Device serial number
          example: "SYS001234"
        company:
          type: string
          description: Company name
          example: "ABC Company"
        status:
          type: string
          description: Combined device status
          example: "Active / Online"
        last_checkin:
          type: string
          format: date-time
          description: ISO8601 timestamp of last check-in
          example: "2025-10-24T14:30:00+00:00"
        tid:
          type: string
          description: Terminal ID
          example: "12345678"
        location_name:
          type: string
          description: Device location
          example: "Store #101"
        category:
          type: string
          description: Device category
          example: "ATM"
        ip_address:
          type: string
          description: Device IP address
          example: "192.168.1.100"
        device_manufacturer:
          type: string
          description: Manufacturer name
          example: "Systech"
        device_model:
          type: string
          description: Device model
          example: "WR11"
        is_dual_carrier:
          type: boolean
          description: Whether device supports dual SIM
          example: false
        signal_strength_percent:
          type: integer
          description: Signal strength as percentage (0-100)
          example: 87
        active_carrier:
          type: string
          description: Active carrier code
          enum: [VZW, ATT, TMO]
          example: "VZW"
        sinr:
          type: number
          format: float
          description: SINR value
          example: 13.2
        sinr_percentage:
          type: integer
          description: SINR as percentage (0-100)
          example: 66
        uptime:
          type: string
          description: Human-readable uptime
          example: "30d 5h"
        service_plan:
          type: string
          description: Service plan title
          example: "Standard Plan"
        payment_method:
          type: string
          description: Payment method title
          example: "Credit Card"

    DeviceDetails:
      type: object
      properties:
        device:
          type: object
          properties:
            status:
              type: string
              example: "Active / Online"
            device_manufacturer:
              type: string
              example: "Systech"
            device_model:
              type: string
              example: "WR11"
            configuration:
              type: string
              example: "Default Config"
            last_checkin:
              type: string
              format: date-time
              example: "2025-10-24T14:30:00+00:00"
            last_uptime:
              type: string
              example: "30 days, 5 hours"
            serial_number:
              type: string
              example: "SYS001234"
            imei:
              type: string
              example: "123456789012345"
            ip_address:
              type: string
              example: "192.168.1.100"
        location:
          type: object
          properties:
            location_name:
              type: string
              example: "Store #101"
            address:
              type: object
              properties:
                address_1:
                  type: string
                  example: "123 Main St"
                city:
                  type: string
                  example: "New York"
                state:
                  type: string
                  example: "NY"
                zip_code:
                  type: string
                  example: "10001"
            tid:
              type: string
              example: "12345678"
            category:
              type: string
              example: "ATM"
        plan:
          type: object
          properties:
            company:
              type: string
              example: "ABC Company"
            service_plan:
              type: string
              example: "Standard Plan"
            flat_rate:
              type: number
              format: float
              example: 50.00

    DeviceStatus:
      type: object
      properties:
        serial_number:
          type: string
          example: "SYS001234"
        status:
          type: string
          enum: [active, inactive, maintenance]
          example: "active"
        last_checkin:
          type: string
          format: date-time
          example: "2025-10-24T13:30:00+00:00"
        uptime_hours:
          type: integer
          example: 363
        signal_strength:
          type: integer
          description: Signal strength in dBm
          example: -75
        ip_address:
          type: string
          example: "192.168.1.100"
        carrier:
          type: string
          enum: [verizon, att, tmobile]
          example: "verizon"
        connectivity:
          type: object
          properties:
            primary_carrier:
              type: string
              example: "verizon"
            backup_carrier:
              type: string
              nullable: true
              example: null
            connection_quality:
              type: string
              enum: [excellent, good, fair, poor, unknown]
              example: "good"
        alerts:
          type: array
          items:
            type: string
          example: []

    DeviceUsage:
      type: object
      properties:
        serial_number:
          type: string
          example: "SYS001234"
        billing_cycle:
          type: object
          properties:
            start_date:
              type: string
              format: date-time
              example: "2025-10-01T00:00:00+00:00"
            end_date:
              type: string
              format: date-time
              example: "2025-10-31T23:59:59+00:00"
            short_display:
              type: string
              example: "Oct 2025"
        data_usage:
          type: object
          properties:
            current_bytes:
              type: integer
              example: 52428800
            current_readable:
              type: string
              example: "50.00 MB"
            projected_bytes:
              type: integer
              example: 104857600
            projected_readable:
              type: string
              example: "100.00 MB"
        pricing:
          type: object
          properties:
            plan_price:
              type: number
              format: float
              example: 50.00
            dual_sim_price:
              type: number
              format: float
              example: 0.00
            projected_total_price:
              type: number
              format: float
              example: 50.00

    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
          example: 42
        page:
          type: integer
          description: Current page number
          example: 1
        per_page:
          type: integer
          description: Items per page
          example: 50

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
              example: "INVALID_API_KEY"
            message:
              type: string
              description: Human-readable error message
              example: "The provided API key is invalid, expired, or inactive."
            status:
              type: integer
              description: HTTP status code
              example: 401

  responses:
    Unauthorized:
      description: Authentication required or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_key:
              summary: Missing API key
              value:
                error:
                  code: "MISSING_API_KEY"
                  message: "API key is required. Please provide an API key in the X-API-Key header."
                  status: 401
            invalid_key:
              summary: Invalid API key
              value:
                error:
                  code: "INVALID_API_KEY"
                  message: "The provided API key is invalid, expired, or inactive."
                  status: 401
            expired_key:
              summary: Expired API key
              value:
                error:
                  code: "EXPIRED_API_KEY"
                  message: "The provided API key has expired."
                  status: 401
            inactive_key:
              summary: Inactive API key
              value:
                error:
                  code: "INACTIVE_API_KEY"
                  message: "The provided API key is inactive."
                  status: 401

    Forbidden:
      description: Insufficient permissions or access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            insufficient_permissions:
              summary: Insufficient permissions
              value:
                error:
                  code: "INSUFFICIENT_PERMISSIONS"
                  message: "Your API key does not have permission to access this resource. Required permission: device_usages.read"
                  status: 403
            gateway_enforcement:
              summary: Direct access blocked
              value:
                error:
                  code: "FORBIDDEN"
                  message: "API access must be made through the API Gateway."
                  status: 403
            device_access_denied:
              summary: Device access denied
              value:
                error:
                  code: "FORBIDDEN"
                  message: "You do not have permission to access this device."
                  status: 403

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            device_not_found:
              summary: Device not found
              value:
                error:
                  code: "NOT_FOUND"
                  message: "Device not found."
                  status: 404
            billing_cycle_not_found:
              summary: Billing cycle not found
              value:
                error:
                  code: "NOT_FOUND"
                  message: "Current billing cycle not found."
                  status: 404

    ServiceUnavailable:
      description: API temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            api_disabled:
              summary: API temporarily disabled
              value:
                error:
                  code: "SERVICE_UNAVAILABLE"
                  message: "API access is temporarily unavailable. Please try again later."
                  status: 503
